name: CreDaily

on:
  push:
    paths:
      - "main-development/*.bat"

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current date
        id: get_date
        run: |
          now=$(date "+%Y-%m-%d")
          echo "::set-output name=date::$now"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "unstable-build-${{ steps.get_date.outputs.date }}"
          name: "unstable build ${{ steps.get_date.outputs.date }}"
          body: "unstable version, do not use or use it at your own risk"
          draft: false
          prerelease: true
